name: CI

on:
  workflow_call:
    inputs:
      ci_target_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      name:
        description: "Manual trigger"

env:
  ROS_DISTRO: rolling
  # Pinned to avoid a flaky api.github.com lookup for the latest release
  # Keep it updated with the latest version from
  # https://github.com/ros-infrastructure/ros-apt-source/releases
  # (an outdated version stops working when the ROS repository key changes)
  ROS_APT_SOURCE_VERSION: 1.3.0

jobs:

  micro_ros_build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          path: src/micro_ros_setup
          ref: ${{ inputs.ci_target_ref }}

      # Installing the ROS apt source beforehand makes setup-ros skip its
      # api.github.com lookup, which is often rate-limited on shared runners
      - name: Install ROS apt source
        run: |
          apt-get update && apt-get install -y ca-certificates curl
          curl -fL -o /tmp/ros2-apt-source.deb https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-testing-apt-source_${ROS_APT_SOURCE_VERSION}.resolute_all.deb
          apt-get install -y /tmp/ros2-apt-source.deb

      - uses: ros-tooling/setup-ros@0.7.19
        with:
          # Rolling binaries for Ubuntu Resolute are only published to the
          # ros2-testing repository; the main repository currently ships
          # Lyrical only
          # Revert once Rolling syncs to the main repository
          use-ros2-testing: true
          required-ros-distributions: ${{ env.ROS_DISTRO }}

      - name: Dependencies
        run: |
          apt update
          rosdep update --rosdistro ${{ env.ROS_DISTRO }}
          rosdep install --rosdistro ${{ env.ROS_DISTRO }} -y --from-paths src --ignore-src -y

      - name: Build
        run: |
          . /opt/ros/${{ env.ROS_DISTRO }}/setup.sh
          colcon build

      - name: Install micro-ROS build system
        run: |
            (test -f install/micro_ros_setup/lib/micro_ros_setup/build_firmware.sh) && true || false

      - name: Sanitize Artifact Name
        id: sanitize-name
        run: |
          sanitized_name=$(echo "${{ inputs.ci_target_ref }}" | sed 's/[\/:*?"<>|\\]/_/g')
          echo "sanitized_name=$sanitized_name" >> $GITHUB_ENV
          echo "::set-output name=sanitized_name::$sanitized_name"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: micro_ros_build_${{ steps.sanitize-name.outputs.sanitized_name }}
          path: install

  micro_ros_agent:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    strategy:
      fail-fast: false
    needs: micro_ros_build

    steps:
      - uses: actions/checkout@v7
        with:
          path: src/micro_ros_setup
          ref: ${{ inputs.ci_target_ref }}

      # Installing the ROS apt source beforehand makes setup-ros skip its
      # api.github.com lookup, which is often rate-limited on shared runners
      - name: Install ROS apt source
        run: |
          apt-get update && apt-get install -y ca-certificates curl
          curl -fL -o /tmp/ros2-apt-source.deb https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-testing-apt-source_${ROS_APT_SOURCE_VERSION}.resolute_all.deb
          apt-get install -y /tmp/ros2-apt-source.deb

      - uses: ros-tooling/setup-ros@0.7.19
        with:
          # Rolling binaries for Ubuntu Resolute are only published to the
          # ros2-testing repository; the main repository currently ships
          # Lyrical only
          # Revert once Rolling syncs to the main repository
          use-ros2-testing: true
          required-ros-distributions: ${{ env.ROS_DISTRO }}

      - name: dependencies
        run: |
          apt update
          apt install -y ros-${{ env.ROS_DISTRO }}-rmw-fastrtps-cpp
          rosdep update --rosdistro ${{ env.ROS_DISTRO }}
          rosdep install --rosdistro ${{ env.ROS_DISTRO }} -y --from-paths src --ignore-src -y

      - name: Sanitize Artifact Name
        id: sanitize-name
        run: |
          sanitized_name=$(echo "${{ inputs.ci_target_ref }}" | sed 's/[\/:*?"<>|\\]/_/g')
          echo "sanitized_name=$sanitized_name" >> $GITHUB_ENV
          echo "::set-output name=sanitized_name::$sanitized_name"

      - uses: actions/download-artifact@v8.0.1
        with:
          name: micro_ros_build_${{ steps.sanitize-name.outputs.sanitized_name }}
          path: install

      # Workaround https://github.com/actions/upload-artifact/issues/38
      - run: |
          chmod +x -R install

      - name: build
        run: |
          . /opt/ros/${{ env.ROS_DISTRO }}/setup.sh
          . install/local_setup.sh
          ros2 run micro_ros_setup create_agent_ws.sh
          ros2 run micro_ros_setup build_agent.sh

      - name: installation
        run: |
            (test -f install/micro_ros_agent/lib/micro_ros_agent/micro_ros_agent) && true || false

  micro_ros_client:
    runs-on: ubuntu-latest
    needs: micro_ros_build
    container:
      image: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - rtos: host
            platform: null
            configuration: null
            transport_arguments: null
            binary: 'install/micro_ros_demos_rclc/lib/micro_ros_demos_rclc/int32_publisher/int32_publisher'

          - rtos: generate_lib
            platform: null
            configuration: null
            transport_arguments: null
            build_arguments: $(pwd)/src/micro_ros_setup/config/generate_lib/generic/demo_toolchain.cmake
            binary: 'firmware/build/libmicroros.a'

          - rtos: freertos
            platform: crazyflie21
            configuration: crazyflie_position_publisher
            transport_arguments: -t serial -d 1
            binary: 'firmware/freertos_apps/microros_crazyflie21_extensions/cf2.bin'

          - rtos: freertos
            platform: olimex-stm32-e407
            configuration: int32_publisher
            transport_arguments: -t serial -d 1
            binary: 'firmware/freertos_apps/microros_olimex_e407_extensions/build/micro-ROS.elf'

          - rtos: freertos
            platform: nucleo_f446re
            configuration: int32_publisher
            transport_arguments: -t serial -d 1
            binary: 'firmware/freertos_apps/microros_nucleo_f446re_extensions/build/micro-ROS.elf'

          - rtos: freertos
            platform: nucleo_f446ze
            configuration: int32_publisher
            transport_arguments: -t serial -d 1
            binary: 'firmware/freertos_apps/microros_nucleo_f446ze_extensions/build/micro-ROS.elf'

          - rtos: freertos
            platform: nucleo_f746zg
            configuration: int32_publisher
            transport_arguments: -t serial -d 1
            binary: 'firmware/freertos_apps/microros_nucleo_f746zg_extensions/build/micro-ROS.elf'

          - rtos: freertos
            platform: nucleo_f767zi
            configuration: int32_publisher
            transport_arguments: -t serial -d 1
            binary: 'firmware/freertos_apps/microros_nucleo_f767zi_extensions/build/micro-ROS.elf'

          - rtos: freertos
            platform: esp32
            configuration: int32_publisher
            transport_arguments: -t serial -d 1
            binary: 'firmware/freertos_apps/microros_esp32_extensions/build/int32_publisher.elf'

          - rtos: zephyr
            platform: olimex-stm32-e407
            configuration: int32_publisher
            transport_arguments: -t serial-usb
            binary: 'firmware/build/zephyr/zephyr.bin'

          - rtos: zephyr
            platform: discovery_l475_iot1
            configuration: int32_publisher
            transport_arguments: -t serial-usb
            binary: 'firmware/build/zephyr/zephyr.bin'

          - rtos: zephyr
            platform: nucleo_h743zi
            configuration: int32_publisher
            transport_arguments: -t serial -d 3
            binary: 'firmware/build/zephyr/zephyr.bin'

          - rtos: zephyr
            platform: nucleo_f746zg
            configuration: int32_publisher
            transport_arguments: -t serial -d 3
            binary: 'firmware/build/zephyr/zephyr.bin'

          - rtos: zephyr
            platform: host
            configuration: ping_pong
            transport_arguments: -t udp -i 192.168.1.1 -p 8080
            binary: 'firmware/build/zephyr/zephyr.exe'

          - rtos: raspbian
            platform: buster_v7
            configuration: agent_lite
            binary: 'firmware/bin/micro_ros_agent_lite'

          - rtos: raspbian
            platform: buster_v7
            configuration: weather_publisher
            binary: 'firmware/bin/weather_publisher'

    steps:
      - uses: actions/checkout@v7
        with:
          path: src/micro_ros_setup
          ref: ${{ inputs.ci_target_ref }}

      # Installing the ROS apt source beforehand makes setup-ros skip its
      # api.github.com lookup, which is often rate-limited on shared runners
      - name: Install ROS apt source
        run: |
          apt-get update && apt-get install -y ca-certificates curl
          curl -fL -o /tmp/ros2-apt-source.deb https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-testing-apt-source_${ROS_APT_SOURCE_VERSION}.resolute_all.deb
          apt-get install -y /tmp/ros2-apt-source.deb

      - uses: ros-tooling/setup-ros@0.7.19
        with:
          # Rolling binaries for Ubuntu Resolute are only published to the
          # ros2-testing repository; the main repository currently ships
          # Lyrical only
          # Revert once Rolling syncs to the main repository
          use-ros2-testing: true
          required-ros-distributions: ${{ env.ROS_DISTRO }}

      - name: Dependencies
        run: |
          apt update
          apt upgrade -y
          rosdep update --rosdistro ${{ env.ROS_DISTRO }}
          rosdep install --rosdistro ${{ env.ROS_DISTRO }} -y --from-paths src --ignore-src -y

      - name: Sanitize Artifact Name
        id: sanitize-name
        run: |
          sanitized_name=$(echo "${{ inputs.ci_target_ref }}" | sed 's/[\/:*?"<>|\\]/_/g')
          echo "sanitized_name=$sanitized_name" >> $GITHUB_ENV
          echo "::set-output name=sanitized_name::$sanitized_name"

      - uses: actions/download-artifact@v8.0.1
        with:
          name: micro_ros_build_${{ steps.sanitize-name.outputs.sanitized_name }}
          path: install

      # Workaround https://github.com/actions/upload-artifact/issues/38
      - run: |
          chmod +x -R install

      - name: Configure and build micro-ROS
        run: |
          . /opt/ros/${{ env.ROS_DISTRO }}/setup.sh
          . install/local_setup.sh
          ros2 run micro_ros_setup create_firmware_ws.sh ${{ matrix.rtos }} ${{ matrix.platform }}
          ros2 run micro_ros_setup configure_firmware.sh ${{ matrix.configuration }} ${{ matrix.transport_arguments }}
          ros2 run micro_ros_setup build_firmware.sh ${{ matrix.build_arguments }}

      # TEMPORARY: report which 'rclc_sleep_ms' implementation each target compiles
      # and whether it reaches the final binary, revert before merging
      - name: Report rclc_sleep_ms backend
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          report() { echo "$1" | tee -a $GITHUB_STEP_SUMMARY; }
          command -v readelf >/dev/null || apt-get install -y binutils
          report "### ${{ matrix.rtos }} ${{ matrix.platform }} ${{ matrix.configuration }}"
          objs=$(find . -path '*rclc*' \( -name 'sleep.c.o' -o -name 'sleep.c.obj' \))
          if [ -z "$objs" ]; then
            report "- rclc is not built for this target"
            exit 0
          fi
          for obj in $objs; do
            calls=$(readelf -sW "$obj" | grep -oE 'UND +(nanosleep|usleep)' | awk '{print $2}' | sort -u | tr '\n' ' ' || true)
            report "- \`$obj\` calls: **${calls:-none}**"
          done
          binary="${{ matrix.binary }}"
          elf="${binary%.bin}"
          [ "$elf" != "$binary" ] && elf="$elf.elf"
          if [[ "$elf" == *.a ]] || ! readelf -h "$elf" >/dev/null 2>&1; then
            report "- no final ELF to inspect"
          elif readelf -d "$elf" 2>/dev/null | grep NEEDED >/dev/null; then
            report "- \`$elf\` is dynamically linked, resolved against libc at load time"
          elif readelf -sW "$elf" | grep -w rclc_sleep_ms >/dev/null; then
            report "- \`rclc_sleep_ms\` is linked into \`$elf\`"
          else
            report "- \`rclc_sleep_ms\` is NOT in \`$elf\`: discarded, link not exercised"
          fi

      - name: Check binaries
        run: |
          (test -f ${{ matrix.binary }}) && true || false
